name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS arm64
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: brew install autoconf automake cmake libtool pkg-config yasm

      - name: Configure
        run: ./configure --std=c++17 --release-build --strip-binary

      - name: Build
        run: make -j3

      - uses: actions/upload-artifact@v4
        with:
          name: onscripter-ru-macos-arm64
          path: DerivedData/MacOSX-arm64/onscripter-ru
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            configure_args: ""
            output: DerivedData/Posix-x86_64/onscripter-ru
          - arch: arm64
            runner: ubuntu-22.04-arm
            configure_args: --prefer-clang
            output: DerivedData/Posix-arm64/onscripter-ru
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential clang cmake git libasound2-dev \
            libclang-dev libegl1-mesa-dev libgl1-mesa-dev libreadline-dev \
            libtool libxrandr-dev mercurial pkg-config subversion unzip yasm

      - name: Configure
        run: ./configure --std=c++17 --release-build --strip-binary ${{ matrix.configure_args }}

      - name: Build
        run: make -j"$(getconf _NPROCESSORS_ONLN)"

      - uses: actions/upload-artifact@v4
        with:
          name: onscripter-ru-linux-${{ matrix.arch }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  windows:
    name: Windows i686
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CC: i686-w64-mingw32-gcc
      CXX: i686-w64-mingw32-g++
      LD: i686-w64-mingw32-ld
      AR: i686-w64-mingw32-ar
      RANLIB: i686-w64-mingw32-ranlib
      AS: i686-w64-mingw32-as

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils-mingw-w64-i686 cmake gcc-mingw-w64-i686 \
            g++-mingw-w64-i686 git mercurial pkg-config subversion unzip yasm

      - name: Configure
        run: ./configure --std=c++17 --cross=i686-w64-mingw32 --release-build --strip-binary

      - name: Build
        run: make -j"$(getconf _NPROCESSORS_ONLN)"

      - name: Stage artifact
        run: |
          mkdir -p ciout
          cp DerivedData/MinGW-i686/onscripter-ru.exe ciout/
          cp -R Resources/Windows/dlls ciout/

      - uses: actions/upload-artifact@v4
        with:
          name: onscripter-ru-windows-i686
          path: ciout
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential cmake git libasound2-dev \
            libegl1-mesa-dev libgl1-mesa-dev libreadline-dev libtool \
            libxrandr-dev mercurial openssl pkg-config python-is-python3 \
            subversion unzip wget yasm zip

      - name: Build
        run: ./Scripts/quickdroid.tool --release

      - uses: actions/upload-artifact@v4
        with:
          name: onscripter-ru-android
          path: DerivedData/Droid-package/onscripter-ru.apk
          if-no-files-found: error

  ios:
    name: iOS arm64
    runs-on: macos-14
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: brew install autoconf automake cmake libtool pkg-config yasm

      - name: Limit legacy iOS dependencies to arm64
        run: |
          sed -i '' '/2F5351A61D51FF6A0023D8F0.*PBXTargetDependency.*,/d' ONScripter.xcodeproj/project.pbxproj
          sed -i '' '/CEF2085E21ADF38300D01AD8.*PBXTargetDependency.*,/d' ONScripter.xcodeproj/project.pbxproj

      - name: Build
        run: |
          xcodebuild \
            -project ONScripter.xcodeproj \
            -scheme onscripter-ru-ios \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData/CI-ios \
            ARCHS=arm64 \
            VALID_ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - uses: actions/upload-artifact@v4
        with:
          name: onscripter-ru-ios-arm64
          path: DerivedData/CI-ios/Build/Products/Release/onscripter-ru-ios.app
          if-no-files-found: error
