name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update (for example, v3.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  macos:
    name: macOS arm64
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install build tools
        run: brew install autoconf automake cmake libtool pkg-config yasm

      - name: Configure
        run: ./configure --std=c++17 --release-build --strip-binary

      - name: Build
        run: make -j3

      - uses: actions/upload-artifact@v7
        with:
          name: onscripter-ru-macos-arm64
          path: DerivedData/MacOSX-arm64/onscripter-ru
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            configure_args: ""
            output: DerivedData/Posix-x86_64/onscripter-ru
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential clang cmake git libasound2-dev \
            libclang-dev libegl1-mesa-dev libgl1-mesa-dev libreadline-dev \
            libtool libxrandr-dev mercurial pkg-config subversion unzip yasm

      - name: Configure
        run: ./configure --std=c++17 --release-build --strip-binary ${{ matrix.configure_args }}

      - name: Build
        run: make -j"$(getconf _NPROCESSORS_ONLN)"

      - uses: actions/upload-artifact@v7
        with:
          name: onscripter-ru-linux-${{ matrix.arch }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  windows:
    name: Windows i686
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CC: i686-w64-mingw32-gcc
      CXX: i686-w64-mingw32-g++
      LD: i686-w64-mingw32-ld
      AR: i686-w64-mingw32-ar
      RANLIB: i686-w64-mingw32-ranlib
      AS: i686-w64-mingw32-as

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils-mingw-w64-i686 cmake gcc-mingw-w64-i686 \
            g++-mingw-w64-i686 git mercurial pkg-config subversion unzip yasm

      - name: Configure
        run: ./configure --std=c++17 --cross=i686-w64-mingw32 --release-build --strip-binary

      - name: Build
        run: make -j"$(getconf _NPROCESSORS_ONLN)"

      - name: Stage artifact
        run: |
          mkdir -p ciout
          cp DerivedData/MinGW-i686/onscripter-ru.exe ciout/
          cp -R Resources/Windows/dlls ciout/

      - uses: actions/upload-artifact@v7
        with:
          name: onscripter-ru-windows-i686
          path: ciout
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential cmake git libasound2-dev \
            libegl1-mesa-dev libgl1-mesa-dev libreadline-dev libtool \
            libxrandr-dev mercurial openssl pkg-config python-is-python3 \
            subversion unzip wget yasm zip

      - name: Build
        run: |
          for arch in arm arm64; do
            ./configure --std=c++17 --droid-build --droid-arch="$arch" --release-build --strip-binary
            make clean
            make
          done
          make apkall

      - uses: actions/upload-artifact@v7
        with:
          name: onscripter-ru-android
          path: DerivedData/Droid-package/onscripter-ru.apk
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      group: release-${{ github.repository }}-${{ inputs.tag }}
      cancel-in-progress: false
    needs:
      - macos
      - linux
      - windows
      - android
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash Scripts/validate_release_tag.sh "$RELEASE_TAG" "$GITHUB_SHA"

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Package release assets
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag_safe=${RELEASE_TAG//\//-}
          mkdir -p release

          chmod +x artifacts/onscripter-ru-macos-arm64/onscripter-ru
          tar -C artifacts/onscripter-ru-macos-arm64 -czf \
            "release/onscripter-ru-${tag_safe}-macos-arm64.tar.gz" \
            onscripter-ru

          chmod +x artifacts/onscripter-ru-linux-x86_64/onscripter-ru
          tar -C artifacts/onscripter-ru-linux-x86_64 -czf \
            "release/onscripter-ru-${tag_safe}-linux-x86_64.tar.gz" \
            onscripter-ru

          (
            cd artifacts/onscripter-ru-windows-i686
            zip -qr "../../release/onscripter-ru-${tag_safe}-windows-i686.zip" .
          )

          cp artifacts/onscripter-ru-android/onscripter-ru.apk \
            "release/onscripter-ru-${tag_safe}-android.apk"

          cd release
          sha256sum onscripter-ru-* > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          bash Scripts/validate_release_tag.sh "$RELEASE_TAG" "$GITHUB_SHA"
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber --repo "$GH_REPO"
          else
            gh release create "$RELEASE_TAG" release/* \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
